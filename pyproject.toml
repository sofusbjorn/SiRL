    "mujoco>=3.7.0",
    "natnet>=0.2.0",
    "numpy>=2.4.4",
    "stable-baselines3>=2.8.0",
]

[dependency-groups]
dev = [
    "jupyter-book>=2.1.4",
    "jupyterlab>=4.5.6",
    "jupyterlab-myst>=2.6.0",
    "matplotlib>=3.10.8",
    "mystmd>=1.8.3",
    "numpy>=2.4.4",
]
